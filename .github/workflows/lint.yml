name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python linters
        run: |
          python -m pip install --upgrade pip
          pip install black ruff

      - name: Run Ruff
        run: ruff check app

      - name: Run Black check
        run: black --check app
